name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://induschan-proxy.asphocal.workers.dev/boards/b/catalog https://indiachan.top/boards/b/catalog; do
            echo "=== $u"; curl -s -D - -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/131.0.0.0" "$u" -o body.html | head -30; head -c 1500 body.html; echo; done
          curl -s https://www.cloudflare.com/cdn-cgi/trace
